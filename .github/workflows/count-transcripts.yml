name: Count transcripts
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many companies (0 = all)"
        default: "20"
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python count_transcripts.py
        env:
          LIMIT: ${{ inputs.limit }}
      - uses: actions/upload-artifact@v4
        with:
          name: transcript-counts
          path: transcript_counts.csv
