name: Fetch Q1 queue
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many companies (0 = all)"
        default: "0"
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gauravbhosale30-coder/results-tracker-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: pip install requests
      - run: python fetch_queue.py
        env:
          LIMIT: ${{ inputs.limit }}
      - name: Save queue to the private data repo
        if: always()
        run: |
          cd data
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add queue
          git commit -m "Q1 FY27 reading queue" || echo "No changes"
          git push
